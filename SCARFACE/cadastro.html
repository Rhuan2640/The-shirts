<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | SCARFACE</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body class="auth">
<a class="auth-logo" href="index.html">SCARFACE</a>
<form class="auth-card" id="cadForm" novalidate>
<h1>CADASTRO</h1>
<input id="nome" placeholder="Nome">
<input id="email" type="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha (mín. 6 caracteres)">
<input id="senha2" type="password" placeholder="Confirmar senha">
<input id="cpf" placeholder="CPF" maxlength="14">
<input id="tel" placeholder="Telefone" maxlength="15">
<p class="erro"></p>
<button class="btn black" type="submit">CRIAR CONTA</button>
<p>Já tem conta? <a href="login.html"><b>Entrar</b></a></p>
</form>
<script src="js/produtos.js"></script><script src="js/script.js"></script><script src="js/carrinho.js"></script><script src="js/login.js"></script>
</body></html>
